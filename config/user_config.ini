[Settings]
# Personal overrides. v3 loads config/config.ini first, then this file.
source_file = config/user_demo.txt
final_file = output/my_iptv.txt
open_unmatch_category = False
open_url_info = False
open_update_time = True
update_time_position = top
open_m3u_result = True

open_local = True
open_subscribe = True
open_history = False
origin_type_prefer = subscribe,local
local_num = 1
subscribe_num = 3
output_urls_limit = 3

open_speed_test = True
open_filter_resolution = True
open_filter_speed = True
open_full_speed_test = False
open_supply = True
min_resolution = 1920x1080
max_resolution = 3840x2160
min_speed = 0.5
resolution_speed_map = 1280x720:0.3,1920x1080:0.5,3840x2160:1.0
speed_test_limit = 12
speed_test_timeout = 10
speed_test_filter_host = True
request_timeout = 10

ipv6_support = True
ipv_type = all
ipv_type_prefer = ipv6,ipv4
location = 湖北
isp = 移动

open_service = False
open_rtmp = False
update_interval = 0
